name: Publish to npm

# Publishing a release (draft or otherwise) creates its tag and publishes the
# package. Tests run first, so a red build cannot reach the registry.
#
# Requires an `NPM_TOKEN` repository secret — an npm automation token with
# publish rights on the @3sln scope.

on:
  release:
    types:
      - published

permissions:
  contents: read
  # Required for npm provenance. Drop this, and the --provenance flag below,
  # if the repository is ever made private: provenance only works for packages
  # published from a public repository.
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version."
            echo 'Publishing would ship something other than what the release names.'
            exit 1
          fi
          echo "$TAG matches package.json."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Show what will be published
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summarise
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "Published @3sln/ngin@$version from $TAG." >> "$GITHUB_STEP_SUMMARY"
